services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rosetta-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://46.62.229.59:4318/v1/traces
      - SKYVIEW_API_KEY=sk_live_rosetta_12345
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://46.62.204.165:8000
        - VITE_OTEL_EXPORTER_OTLP_ENDPOINT=http://46.62.229.59:4318/v1/traces
        - VITE_SKYVIEW_API_KEY=sk_live_rosetta_12345
    container_name: rosetta-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
